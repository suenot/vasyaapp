name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:translation

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Sidecar placeholders (tauri build script needs the files to exist)
        run: |
          triple=$(rustc -vV | sed -n 's/host: //p')
          for s in stt-sidecar voip-sidecar; do
            mkdir -p src-tauri/$s/target/release
            touch src-tauri/$s/target/release/$s-$triple
          done
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace
